<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Petxercise</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
  :root {
    --green: #1F6B43; --green-dark: #174F32; --tint: #E3F0E7; --line: #DCE0D6;
    --ink: #172019; --muted: #556157; --bg: #F4F5EF; --white: #FFFFFF;
    --sun-bg: #FCE9D2; --sun-fg: #6E3A06;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9EBE4; font-family: Inter, system-ui, sans-serif; color: var(--ink); display: flex; justify-content: center; }
  button { font-family: inherit; cursor: pointer; }
  .phone { width: 100%; max-width: 390px; height: 100vh; max-height: 844px; background: var(--bg); display: flex; flex-direction: column; overflow: hidden; }
  .content { flex: 1 1 auto; overflow-y: auto; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 16px; }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .col.tight { gap: 12px; }
  .row { display: flex; gap: 6px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .brand { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 20px; color: var(--green); }
  .h1 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 24px; }
  .h1.big { font-size: 26px; }
  .h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; }
  .muted { color: var(--muted); font-size: 14px; }
  .small { font-size: 12px; color: var(--muted); }
  .label { font-weight: 600; font-size: 15px; }
  .card { background: var(--white); border-radius: 16px; padding: 16px; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
  .avatar { border-radius: 50%; background: var(--tint); color: var(--green); display: flex; align-items: center; justify-content: center; font-weight: 600; flex: none; }
  .chip { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink); font-size: 13px; font-weight: 600; padding: 0 4px; }
  .chip.on { background: var(--green); border-color: var(--green); color: var(--white); }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .day { width: 46px; height: 64px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--tint); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; }
  .day.rest { background: var(--white); }
  .day.on { background: var(--green); border-color: var(--green); color: var(--white); }
  .hour { min-height: 44px; min-width: 60px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--white); color: var(--ink); display: flex; flex-direction: column; align-items: center; padding: 4px 8px; }
  .hour.sun { background: var(--sun-bg); color: var(--sun-fg); }
  .hour.on { background: var(--green); border-color: var(--green); color: var(--white); }
  .btn { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid var(--line); background: var(--white); color: var(--ink); font-size: 13px; font-weight: 500; }
  .btn.outline { border-color: var(--green); color: var(--green); font-weight: 600; }
  .btn.primary { min-height: 52px; border-radius: 14px; border: none; background: var(--green); color: var(--white); font-size: 15px; font-weight: 600; }
  .tag { font-size: 12px; padding: 4px 10px; border-radius: 12px; background: var(--bg); }
  .alert { background: var(--sun-bg); color: var(--sun-fg); border-radius: 12px; padding: 12px 14px; font-size: 14px; font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); }
  .stats div { background: var(--white); padding: 12px; }
  .stats b { display: block; font-size: 18px; }
  nav { flex: 0 0 72px; background: var(--white); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); }
  nav button { border: none; background: var(--white); color: var(--muted); font-size: 12px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  nav button.on { color: var(--green); font-weight: 600; }
  nav span.bar { width: 24px; height: 3px; border-radius: 2px; background: transparent; }
  nav button.on span.bar { background: var(--green); }
</style>
</head>
<body>
<div class="phone">
  <main class="content" id="app"></main>
  <nav id="tabs"></nav>
</div>

<script>
// ---------- Datos fijos del prototipo ----------
const ACTS = {
  correr:   { label: 'Correr',   short: 'Correr', group: 'Máx. 2 perros con su misma energía', dur: '30 a 45 min' },
  pasear:   { label: 'Pasear',   short: 'Pasear', group: 'Máx. 3 perros de su tamaño', dur: '45 a 60 min' },
  jugar:    { label: 'Jugar',    short: 'Jugar',  group: 'Máx. 3 perros sociables, parque con área canina', dur: '45 a 60 min' },
  descanso: { label: 'Descanso', short: 'Libre',  group: '', dur: '' }
};
const DAYS = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];
const FULL = ['Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado', 'Domingo'];
const HOURS = [
  { h: '7:00', note: 'Fresco', sun: false },
  { h: '8:00', note: 'Fresco', sun: false },
  { h: '17:00', note: 'Tarde', sun: false },
  { h: '18:00', note: 'Atardecer', sun: false },
  { h: '19:00', note: 'Fresco', sun: false }
];
const WALKERS = [
  { id: 'mariana', name: 'Mariana', initials: 'MA', spec: 'Corredora, perros de energía alta', zone: 'Del Valle', acts: ['correr', 'jugar'] },
  { id: 'diego',   name: 'Diego',   initials: 'DI', spec: 'Paseos tranquilos y perros grandes', zone: 'Narvarte', acts: ['pasear'] },
  { id: 'sofia',   name: 'Sofía',   initials: 'SO', spec: 'Juego y socialización', zone: 'Roma', acts: ['jugar', 'pasear'] }
];
const PHOTO_BG = ['#E3F0E7', '#FCE9D2', '#E6ECF5', '#F1E6EF'];
const PHOTO_LABELS = ['Corriendo en el parque', 'Después del paseo', 'Con su grupo', 'Hora de jugar'];

// ---------- Estado de la app ----------
const state = {
  screen: 'home',
  day: 0,
  week: ['correr', 'descanso', 'jugar', 'pasear', 'correr', 'jugar', 'descanso'],
  hours: ['7:00', '7:00', '18:00', '8:00', '7:00', '18:00', '7:00'],
  walker: 'mariana',
  size: 'Mediano',
  energy: 'Alta',
  social: 'Sí',
  cameraOn: false,
  showAlert: false,
  photos: 4
};

// ---------- Acciones: qué pasa cuando tocas un botón ----------
const actions = {
  go: (v) => { state.screen = v; },
  day: (v) => { state.day = Number(v); },
  act: (v) => { state.week[state.day] = v; },
  hour: (v) => { state.hours[state.day] = v; },
  walker: (v) => { state.walker = v; },
  size: (v) => { state.size = v; },
  energy: (v) => { state.energy = v; },
  social: (v) => { state.social = v; },
  camera: () => { state.cameraOn = !state.cameraOn; },
  alert: () => { state.showAlert = !state.showAlert; },
  photo: () => { state.photos += 1; }
};

const btn = (action, value, cls, inner) =>
  `<button class="${cls}" data-action="${action}" data-value="${value}">${inner}</button>`;

// ---------- Pantallas ----------
function homeScreen() {
  const act = state.week[state.day];
  const A = ACTS[act];
  const w = WALKERS.find((x) => x.id === state.walker);
  const days = DAYS.map((d, i) => {
    const cls = 'day' + (i === state.day ? ' on' : '') + (state.week[i] === 'descanso' ? ' rest' : '');
    return btn('day', i, cls, `<span style="font-size:13px;font-weight:600">${d}</span><span style="font-size:10.5px">${ACTS[state.week[i]].short}</span>`);
  }).join('');
  const acts = ['correr', 'pasear', 'jugar', 'descanso']
    .map((k) => btn('act', k, 'chip' + (k === act ? ' on' : ''), ACTS[k].short)).join('');
  const hours = HOURS.map((h) => {
    const cls = 'hour' + (state.hours[state.day] === h.h ? ' on' : (h.sun ? ' sun' : ''));
    return btn('hour', h.h, cls, `<span style="font-size:13px;font-weight:600">${h.h}</span><span style="font-size:10.5px">${h.note}</span>`);
  }).join('');

  const walk = act === 'descanso'
    ? `<div class="muted">Hoy Boss descansa. No hay paseo programado.</div>`
    : `<div class="col tight">
         <div class="small" style="font-size:13px">${A.group} · ${A.dur}</div>
         <div class="label" style="font-size:14px">Horario</div>
         <div class="row" style="flex-wrap:wrap">${hours}</div>
         <div style="display:flex;align-items:center;gap:12px;padding-top:12px;border-top:1px solid var(--line)">
           <div class="avatar" style="width:40px;height:40px;font-size:13px">${w.initials}</div>
           <div style="flex:1"><div class="small">Paseador de Boss</div><div class="label">${w.name}</div></div>
           ${btn('go', 'walkers', 'btn outline', 'Cambiar')}
         </div>
       </div>`;

  return `
    <div><div class="h1 big">Hola, Ana</div><div class="muted" style="font-size:15px">Así va la semana de Boss</div></div>
    <div class="card" style="flex-direction:row;align-items:center;gap:14px">
      <div class="avatar" style="width:64px;height:64px;font-family:'Space Grotesk';font-weight:700;font-size:26px">B</div>
      <div style="flex:1"><div class="h2" style="font-size:20px">Boss</div><div class="small" style="font-size:13px">${state.size} · Energía ${state.energy.toLowerCase()}</div></div>
      ${btn('go', 'profile', 'btn', 'Editar')}
    </div>
    <div class="col" style="gap:8px">
      <div class="label">Semana de Boss</div>
      <div class="row" style="justify-content:space-between">${days}</div>
      <div class="small">Toca un día para cambiar lo que hace Boss.</div>
    </div>
    <div class="card">
      <div class="h2">${FULL[state.day]}: ${A.label}</div>
      <div class="grid4">${acts}</div>
      ${walk}
    </div>
    ${btn('go', 'live', 'btn primary', 'Ver paseo en vivo')}`;
}

function walkersScreen() {
  const act = state.week[state.day];
  const A = ACTS[act];
  const cards = WALKERS.map((x) => {
    const on = x.id === state.walker;
    const ok = x.acts.includes(act);
    return `
      <div class="card" style="gap:10px;border:1.5px solid ${on ? 'var(--green)' : 'var(--line)'}">
        <div style="display:flex;gap:12px;align-items:center">
          <div class="avatar" style="width:48px;height:48px">${x.initials}</div>
          <div><div class="label" style="font-size:16px">${x.name}</div><div class="small" style="font-size:13px">${x.spec}</div></div>
        </div>
        <div class="row" style="flex-wrap:wrap">
          <span class="tag" style="background:var(--tint);color:var(--green-dark)">Sello Petxercise</span>
          <span class="tag">${x.zone}</span>
          <span class="tag" style="${ok ? 'background:var(--sun-bg);color:var(--sun-fg)' : 'color:var(--muted)'}">${ok ? 'Ideal para ' + A.label.toLowerCase() : 'Otra especialidad'}</span>
        </div>
        ${btn('walker', x.id, 'chip' + (on ? ' on' : ''), on ? 'Paseador de Boss' : 'Elegir a ' + x.name)}
      </div>`;
  }).join('');
  return `
    <div><div class="h1">Elige paseador</div><div class="muted">Solo paseadores aprobados por Petxercise. Cada uno lleva máximo 3 perros.</div></div>
    <div style="font-size:13px;color:var(--green);font-weight:600">Para el ${FULL[state.day]} de Boss: ${A.label}</div>
    ${cards}
    <div class="small">Paseadores de ejemplo para el prototipo.</div>`;
}

function liveScreen() {
  const w = WALKERS.find((x) => x.id === state.walker);
  const A = ACTS[state.week[state.day]];
  const view = state.cameraOn
    ? `<div style="height:220px;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px"><div class="label">Cámara del paseador</div><div style="font-size:12px;color:#C9D1C7">Transmisión en vivo</div></div>`
    : `<svg viewBox="0 0 358 220" width="100%" role="img" aria-label="Mapa del recorrido de Boss con zonas de sombra">
         <rect width="358" height="220" fill="#EEF1E8"/>
         <path d="M0 70 H358 M0 150 H358 M90 0 V220 M250 0 V220" stroke="#fff" stroke-width="10" fill="none"/>
         <ellipse cx="170" cy="110" rx="58" ry="36" fill="#CFE5D5"/>
         <ellipse cx="300" cy="40" rx="40" ry="24" fill="#CFE5D5"/>
         <path d="M40 190 L90 150 L130 120 C150 100 190 95 210 110 L250 70 L290 40" stroke="#1F6B43" stroke-width="4" fill="none" stroke-linecap="round"/>
         <circle cx="290" cy="40" r="9" fill="#F2A14A" stroke="#fff" stroke-width="3"/>
         <text x="170" y="114" text-anchor="middle" font-size="11" fill="#174F32">Parque · sombra</text>
       </svg>`;
  return `
    <div><div class="h1">Boss va de paseo</div><div class="muted">Con ${w.name} · ${A.label}</div></div>
    ${state.showAlert ? '<div class="alert">Boss lleva 5 minutos detenido. Ya le avisamos al paseador.</div>' : ''}
    <div class="card" style="padding:0;gap:0;overflow:hidden">
      ${view}
      <div class="stats">
        <div><span class="small">En movimiento</span><b>32 min</b></div>
        <div><span class="small">Detenido</span><b>${state.showAlert ? '5 min' : '3 min'}</b></div>
        <div><span class="small">Distancia</span><b>2.6 km</b></div>
        <div><span class="small">Ruta con sombra</span><b>80%</b></div>
      </div>
    </div>
    <div class="grid2">
      ${btn('camera', '', 'chip on', state.cameraOn ? 'Ver mapa' : 'Ver cámara')}
      ${btn('alert', '', 'chip', state.showAlert ? 'Quitar alerta' : 'Simular alerta')}
    </div>
    <div class="small">Datos de ejemplo de un paseo.</div>`;
}

function albumScreen() {
  const photos = [];
  for (let i = 0; i < state.photos; i++) {
    photos.push(`
      <div style="height:150px;border-radius:14px;background:${PHOTO_BG[i % 4]};display:flex;flex-direction:column;justify-content:flex-end;padding:10px">
        <div style="font-size:13px;font-weight:600">${i < 4 ? PHOTO_LABELS[i] : 'Foto nueva ' + (i - 3)}</div>
        <div style="font-size:11px;color:#3E4A40">${i % 2 === 0 ? 'Subida por el paseador' : 'Subida por Ana'}</div>
      </div>`);
  }
  return `
    <div class="top"><div class="h1">Álbum de Boss</div>${btn('photo', '', 'btn primary', 'Subir foto').replace('btn primary', 'btn primary" style="min-height:44px;padding:0 16px;border-radius:22px')}</div>
    <div class="grid2" style="gap:10px">${photos.reverse().join('')}</div>`;
}

function profileScreen() {
  const opts = (list, key) => list.map((v) => btn(key, v, 'chip' + (state[key] === v ? ' on' : ''), v)).join('');
  const socialText = state.social === 'Sí' ? 'sociables' : 'tranquilos y conocidos';
  const summary = state.social === 'Prefiere solo'
    ? 'Boss pasea solo con su paseador, sin otros perros.'
    : `Boss pasea con perros de tamaño ${state.size.toLowerCase()}, energía ${state.energy.toLowerCase()} y ${socialText}. Nunca más de 3 perros por paseador.`;
  return `
    <div><div class="h1">Perfil de Boss</div><div class="muted">Con esto armamos su grupo ideal.</div></div>
    <div class="card" style="gap:10px">
      <div class="label">Tamaño</div><div class="grid3">${opts(['Chico', 'Mediano', 'Grande'], 'size')}</div>
      <div class="label">Nivel de energía</div><div class="grid3">${opts(['Baja', 'Media', 'Alta'], 'energy')}</div>
      <div class="label">Con otros perros</div><div class="grid3">${opts(['Sí', 'Con algunos', 'Prefiere solo'], 'social')}</div>
    </div>
    <div class="card" style="background:var(--tint);border:none;gap:6px">
      <div class="label" style="color:var(--green-dark)">Grupo ideal para Boss</div>
      <div style="font-size:14px">${summary}</div>
    </div>`;
}

// ---------- Dibujar la app ----------
const SCREENS = { home: homeScreen, walkers: walkersScreen, live: liveScreen, album: albumScreen, profile: profileScreen };
const TABS = [['home', 'Inicio'], ['walkers', 'Paseadores'], ['live', 'En vivo'], ['album', 'Álbum'], ['profile', 'Boss']];

function render() {
  document.getElementById('app').innerHTML =
    `<div class="top"><div class="brand">Petxercise</div><div class="small" style="font-size:13px">Modelo híbrido</div></div>` +
    `<div class="col">${SCREENS[state.screen]()}</div>`;
  document.getElementById('tabs').innerHTML = TABS
    .map(([k, label]) => btn('go', k, state.screen === k ? 'on' : '', `<span class="bar"></span><span>${label}</span>`))
    .join('');
}

document.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-action]');
  if (!b) return;
  actions[b.dataset.action](b.dataset.value);
  render();
});

render();
</script>
</body>
</html>
